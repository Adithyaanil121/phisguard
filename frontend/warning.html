<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard — Navigation Blocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #080c14;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .warning-box {
      background: rgba(17, 24, 39, 0.85);
      border: 2px solid #ef4444;
      border-radius: 16px;
      max-width: 620px;
      width: 100%;
      padding: 36px;
      box-shadow: 0 20px 50px rgba(239, 68, 68, 0.25);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .shield-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .badge {
      display: inline-block;
      background: #ef4444;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 9999px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
    .target-url-box {
      background: #030712;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 8px;
      word-break: break-all;
      font-family: monospace;
      color: #38bdf8;
      font-size: 0.88rem;
      margin-bottom: 24px;
      text-align: left;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-safe {
      background: #10b981;
      color: #022c22;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-override {
      background: transparent;
      color: #94a3b8;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-override:hover { color: #f87171; }
  </style>
</head>
<body>
  <div class="warning-box">
    <div class="shield-icon">🛡️</div>
    <span class="badge">Phishing Hazard Blocked</span>
    <h1>Deceptive Website Ahead</h1>
    <p>
      PhishGuard has blocked navigation to this website. Automated static feature analysis and offline machine learning classification identified high-confidence indicators of credential theft or brand impersonation.
    </p>

    <div class="target-url-box">
      <div style="font-size: 0.7rem; color: #64748b; margin-bottom: 4px;">TARGET DESTINATION:</div>
      <span id="target-url">Loading...</span>
    </div>

    <div class="btn-group">
      <button id="go-back-btn" class="btn-safe">✓ Go Back to Safety (Recommended)</button>
      <button id="override-btn" class="btn-override">I Understand the Risks — Temporarily Proceed (10 Mins)</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get("url") || "Unknown Destination";
    document.getElementById("target-url").textContent = target;

    document.getElementById("go-back-btn").addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    });

    document.getElementById("override-btn").addEventListener("click", () => {
      if (target && target.startsWith("http")) {
        window.location.href = target;
      }
    });
  </script>
</body>
</html>
